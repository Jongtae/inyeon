name: Methodology Review Preview

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full 40-character SHA from main to expose for qualified methodology review
        required: true
        type: string

concurrency:
  group: inyeon-pages-production
  cancel-in-progress: false

jobs:
  build:
    if: vars.INYEON_PRODUCTION_ENABLED != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      review_sha: ${{ steps.source.outputs.review_sha }}
    steps:
      - name: Check out canonical repository state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Validate and select a main-branch commit
        id: source
        env:
          REQUESTED_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.source_sha || github.sha }}
        run: |
          if [[ ! "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source_sha must be a full lowercase 40-character commit SHA" >&2
            exit 1
          fi
          git fetch --no-tags origin main
          git cat-file -e "$REQUESTED_SHA^{commit}"
          if ! git merge-base --is-ancestor "$REQUESTED_SHA" origin/main; then
            echo "source_sha must belong to the canonical main branch" >&2
            exit 1
          fi
          git checkout --detach "$REQUESTED_SHA"
          echo "review_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - name: Validate governance structure
        run: |
          python scripts/check_harness.py
          python scripts/check_l4.py

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm

      - name: Install pinned dependencies and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run candidate quality gates
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm audit --audit-level=high

      - name: Build user and methodology review preview
        env:
          INYEON_RELEASE_SHA: ${{ steps.source.outputs.review_sha }}
          VITE_METHODOLOGY_REVIEW_BUILD: 'true'
        run: |
          npm run build --workspace @inyeon/web
          npm run verify:dist

      - name: Mark user preview as non-production and non-indexable
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/web/dist/index.html')
          text = path.read_text(encoding='utf-8')
          marker = '<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">'
          if marker not in text:
              text = text.replace('<head>', f'<head>\n    {marker}', 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify preview boundary
        run: |
          test -f apps/web/dist/index.html
          test -f apps/web/dist/review.html
          grep -q 'noindex,nofollow,noarchive,nosnippet' apps/web/dist/index.html
          grep -q 'noindex,nofollow,noarchive,nosnippet' apps/web/dist/review.html
          grep -q 'INYEON Methodology Review' apps/web/dist/review.html

      - name: Run browser regression tests
        run: npm run test:e2e --workspace @inyeon/web

      - name: Configure GitHub Pages for preview
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload preview artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: apps/web/dist

      - name: Record preview provenance
        env:
          REVIEW_SHA: ${{ steps.source.outputs.review_sha }}
        run: |
          echo "### INYEON pre-production preview" >> "$GITHUB_STEP_SUMMARY"
          echo "- Purpose: owner UX inspection plus qualified #14 methodology review" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source SHA: \`$REVIEW_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Production release: false" >> "$GITHUB_STEP_SUMMARY"
          echo "- Production readiness gate: intentionally not asserted" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: build
    if: vars.INYEON_PRODUCTION_ENABLED != 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy user and methodology preview artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

  smoke:
    needs:
      - build
      - deploy
    if: vars.INYEON_PRODUCTION_ENABLED != 'true'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Verify remote user and review pages
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 3 "$PAGE_URL" -o user-preview.html
          curl --fail --silent --show-error --retry 5 --retry-delay 3 "${PAGE_URL}review.html" -o review.html
          grep -q 'noindex,nofollow,noarchive,nosnippet' user-preview.html
          grep -q 'noindex,nofollow,noarchive,nosnippet' review.html
          grep -q 'INYEON Methodology Review' review.html

      - name: Record preview URLs
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          REVIEW_SHA: ${{ needs.build.outputs.review_sha }}
        run: |
          echo "### Verified INYEON pre-production preview" >> "$GITHUB_STEP_SUMMARY"
          echo "- User preview URL: $PAGE_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- Methodology review URL: ${PAGE_URL}review.html" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source SHA: \`$REVIEW_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- This is not production evidence and must not update release_state." >> "$GITHUB_STEP_SUMMARY"
