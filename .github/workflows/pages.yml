name: Release GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full 40-character SHA from the main branch to build and deploy
        required: true
        type: string
      operation:
        description: Why this known main-branch commit is being deployed
        required: true
        default: release
        type: choice
        options:
          - release
          - rollback-rehearsal
          - rollback

concurrency:
  group: inyeon-pages-production
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || vars.INYEON_PRODUCTION_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      release_sha: ${{ steps.source.outputs.release_sha }}
    steps:
      - name: Check out canonical repository state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Validate and select a main-branch commit
        id: source
        env:
          REQUESTED_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.source_sha || github.sha }}
        run: |
          if [[ ! "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source_sha must be a full lowercase 40-character commit SHA" >&2
            exit 1
          fi
          git fetch --no-tags origin main
          git cat-file -e "$REQUESTED_SHA^{commit}"
          if ! git merge-base --is-ancestor "$REQUESTED_SHA" origin/main; then
            echo "source_sha must belong to the canonical main branch" >&2
            exit 1
          fi
          git checkout --detach "$REQUESTED_SHA"
          echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - name: Validate governance structure
        run: |
          python scripts/check_harness.py
          python scripts/check_l4.py

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm

      - name: Install pinned dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run release gates
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm audit --audit-level=high

      - name: Build and verify the immutable Pages artifact
        env:
          INYEON_RELEASE_SHA: ${{ steps.source.outputs.release_sha }}
        run: npm run build

      - name: Run production-build browser regression tests
        run: npm run test:e2e --workspace @inyeon/web

      - name: Enforce public-launch correctness gate
        if: vars.INYEON_PRODUCTION_ENABLED == 'true'
        run: npm run check:production-readiness

      - name: Configure GitHub Pages
        if: vars.INYEON_PRODUCTION_ENABLED == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload immutable Pages artifact
        if: vars.INYEON_PRODUCTION_ENABLED == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: apps/web/dist

      - name: Record release provenance
        env:
          OPERATION: ${{ inputs.operation || 'release' }}
          RELEASE_SHA: ${{ steps.source.outputs.release_sha }}
        run: |
          echo "### INYEON Pages candidate" >> "$GITHUB_STEP_SUMMARY"
          echo "- Operation: \`$OPERATION\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source SHA: \`$RELEASE_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Artifact manifest: \`apps/web/dist/release-manifest.json\`" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: build
    if: vars.INYEON_PRODUCTION_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy exact artifact to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

  smoke:
    needs:
      - build
      - deploy
    if: vars.INYEON_PRODUCTION_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the deployed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.build.outputs.release_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm

      - name: Install pinned dependencies and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Verify the deployed origin in a fresh browser
        env:
          INYEON_PRODUCTION_URL: ${{ needs.deploy.outputs.page_url }}
          INYEON_EXPECTED_RELEASE_SHA: ${{ needs.build.outputs.release_sha }}
        run: npm run test:e2e:production --workspace @inyeon/web

      - name: Record verified deployment
        env:
          OPERATION: ${{ inputs.operation || 'release' }}
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          RELEASE_SHA: ${{ needs.build.outputs.release_sha }}
        run: |
          echo "### Verified INYEON Pages deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Operation: \`$OPERATION\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Production URL: $PAGE_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- Verified source SHA: \`$RELEASE_SHA\`" >> "$GITHUB_STEP_SUMMARY"
