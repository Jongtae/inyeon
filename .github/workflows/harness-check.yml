name: Harness and L4 Governance Check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate harness
        run: python scripts/check_harness.py
      - name: Validate L4 governance structure
        run: python scripts/check_l4.py
